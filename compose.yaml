name: cafeclick

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: cafeclick
      POSTGRES_USER: cafeclick
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "cafeclick", "-d", "cafeclick"]
      interval: 3s
      timeout: 3s
      retries: 15

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      PORT: "3001"
      DATABASE_URL: postgresql://cafeclick@db:5432/cafeclick
      PGPASSWORD: ${POSTGRES_PASSWORD:-local-demo}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(response => process.exit(response.ok ? 0 : 1))"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 60s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    environment:
      API_PROXY_TARGET: http://api:3001/api
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(response => process.exit(response.ok ? 0 : 1))"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 60s

volumes:
  postgres-data:
