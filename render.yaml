services:
  - type: web
    name: cafeclick-api
    runtime: docker
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    dockerContext: .
    dockerfilePath: ./docker/api.Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cafeclick-db
          property: connectionString
      - key: WEB_ORIGIN
        sync: false
      - key: SEED_ON_START
        value: "true"
      - key: DEMO_CUSTOMER_PASSWORD
        sync: false
      - key: DEMO_KITCHEN_PASSWORD
        sync: false

databases:
  - name: cafeclick-db
    plan: free
    postgresMajorVersion: "17"
